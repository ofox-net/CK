services:
  - type: web
    name: colour-king
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 16 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: colour-king-db
          property: connectionString
      - key: CK_AUTH_SECRET
        generateValue: true

databases:
  - name: colour-king-db
    plan: free
    databaseName: colour_king
    user: colour_king_user
