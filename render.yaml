services:
  - type: web
    name: colour-king
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: colour-king-db
          property: connectionString
      - key: CK_AUTH_SECRET
        generateValue: true

databases:
  - name: colour-king-db
    plan: free
    databaseName: colour_king
    user: colour_king_user
